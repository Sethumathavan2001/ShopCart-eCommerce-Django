{% extends 'layouts/layout.html' %}
{% block title %}Password Changed{% endblock title %}
{% block content %}
<div class="container auth-wrap">
  <div class="auth-card text-center">
    <div class="empty-state p-0">
      <div class="icon" style="background:#dcfce7;color:var(--sc-success)"><i class="bi bi-check2-circle"></i></div>
      <h4>Password updated</h4>
      <p class="text-muted-2">You can now log in with your new password.</p>
      <a href="{% url 'login' %}" class="btn btn-primary">Log in</a>
    </div>
  </div>
</div>
{% endblock content %}
