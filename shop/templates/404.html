{% extends 'layouts/layout.html' %}
{% block title %}Page Not Found{% endblock title %}
{% block content %}
<div class="container">
  <div class="empty-state py-5 my-4">
    <div class="display-1 fw-800 text-primary">404</div>
    <h4>We couldn't find that page</h4>
    <p class="text-muted-2">The page or product you're looking for may have moved or no longer exists.</p>
    <div class="d-flex justify-content-center gap-2">
      <a href="{% url 'home' %}" class="btn btn-primary">Go home</a>
      <a href="{% url 'shop' %}" class="btn btn-light-soft">Browse products</a>
    </div>
  </div>
</div>
{% endblock content %}
