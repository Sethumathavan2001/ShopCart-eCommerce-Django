{% extends 'layouts/layout.html' %}
{% block title %}Check Your Email{% endblock title %}
{% block content %}
<div class="container auth-wrap">
  <div class="auth-card text-center">
    <div class="empty-state p-0">
      <div class="icon"><i class="bi bi-envelope-check"></i></div>
      <h4>Check your inbox</h4>
      <p class="text-muted-2">If an account exists for that email, we've sent instructions to reset your password.</p>
      <a href="{% url 'login' %}" class="btn btn-primary">Back to login</a>
    </div>
  </div>
</div>
{% endblock content %}
