{% extends 'layouts/layout.html' %}
{% block title %}Reset Password{% endblock title %}
{% block content %}
<div class="container auth-wrap">
  <div class="auth-card">
    <div class="text-center mb-4">
      <h1>Forgot your password?</h1>
      <p class="text-muted-2 mb-0">Enter your email and we'll send you a link to reset it.</p>
    </div>
    <form method="post">
      {% csrf_token %}
      <label class="form-label small fw-semibold" for="id_email">Email</label>
      <div class="input-icon mb-3"><i class="bi bi-envelope"></i>
        <input type="email" name="email" id="id_email" class="form-control" required autofocus>
      </div>
      {{ form.email.errors }}
      <button class="btn btn-primary btn-lg w-100">Send reset link</button>
    </form>
    <p class="text-center small mt-4 mb-0"><a href="{% url 'login' %}"><i class="bi bi-arrow-left"></i> Back to login</a></p>
  </div>
</div>
{% endblock content %}
