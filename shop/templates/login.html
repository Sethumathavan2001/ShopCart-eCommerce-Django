{% extends 'layouts/layout.html' %}
{% load static %}
{% block title %}Login{% endblock title %}
{% block content %}
<div class="container auth-wrap">
  <div class="auth-card">
    <div class="text-center mb-4">
      <img src="{% static 'images/logo-mark.svg' %}" alt="ShopCart" class="logo">
      <h1>Welcome back</h1>
      <p class="text-muted-2 mb-0">Log in to continue shopping</p>
    </div>
    <form method="post" action="">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3">
        <label for="loginUser" class="form-label small fw-semibold">Username or email</label>
        <div class="input-icon"><i class="bi bi-person"></i>
          <input type="text" class="form-control" id="loginUser" name="user" value="{{ request.POST.user|default:'' }}" autocomplete="username" required autofocus>
        </div>
      </div>
      <div class="mb-3">
        <div class="d-flex justify-content-between">
          <label for="loginPassword" class="form-label small fw-semibold">Password</label>
          <a href="{% url 'password_reset' %}" class="small">Forgot password?</a>
        </div>
        <div class="input-icon"><i class="bi bi-lock"></i>
          <input type="password" class="form-control" id="loginPassword" name="password" autocomplete="current-password" required>
        </div>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" name="remember" id="remember" checked>
        <label class="form-check-label small" for="remember">Keep me signed in</label>
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-100">Log in</button>
    </form>
    <p class="text-center small text-muted-2 mt-4 mb-0">New to ShopCart? <a href="{% url 'register' %}" class="fw-semibold">Create an account</a></p>
  </div>
</div>
{% endblock content %}
